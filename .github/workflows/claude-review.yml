name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run `git diff main` to see the changes in this PR.
            Look for bugs, logic errors, and correctness issues in the changed code.
            Post your findings as a comment using the mcp__github_comment__update_claude_comment tool.
          show_full_output: "true"
