name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.
            Run `git diff origin/main...HEAD` to see the changes.
            Look for bugs, logic errors, and correctness issues in the changed code.
            Post your findings as a PR comment using: gh pr comment ${{ github.event.pull_request.number }} --body "your findings"
          additional_permissions: |
            Bash(gh pr comment:*)
            Bash(gh pr view:*)
            Bash(git diff:*)
          show_full_output: "true"
